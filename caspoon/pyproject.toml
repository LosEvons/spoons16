[project]
name = "caspoon"
version = "0.1.0"
description = "Caspoon Reverse Engineering Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  { name = "LosEvons" }
]

dependencies = [
  "pyelftools>=0.29,<1.0",       # ELF file parsing
  "r2pipe>=1.7.0,<2.0.0",        # radare2 interface
  "rich>=13.0.0,<15.0.0",        # Text rendering (CLI output)
]

[project.optional-dependencies]
# Qt6 GUI interface
gui = [
  "pyside6>=6.6.0",
]

# Windows PE file support
windows = [
  "pefile>=2023.2.7,<2025.0.0",
]

# Pattern detection features
patterns = [
  "capstone>=5.0.0,<6.0.0",
  "yara-python>=4.3.0,<5.0.0",
]

# Advanced analysis
advanced = [
  "scipy>=1.10.0,<2.0.0",
]

# Graph generation and visualization
graphs = [
  "networkx>=3.0,<4.0",
]

# Report generation
reports = [
  "jinja2>=3.1.0,<4.0.0",
]

# Development tools
dev = [
  # Testing
  "pytest>=7.0.0,<10.0.0",
  "pytest-cov>=4.0.0,<5.0.0",
  "pytest-asyncio>=0.21.0,<2.0.0",
  "pytest-mock>=3.10.0,<4.0.0",
  "pytest-xdist>=3.0.0,<4.0.0",
  "pytest-timeout>=2.1.0,<3.0.0",
  
  # Code quality
  "black>=23.0.0,<26.0.0",
  "mypy>=1.0.0,<2.0.0",
  "ruff>=0.1.0,<1.0.0",
]

# All optional features
all = [
  "pefile>=2023.2.7,<2025.0.0",
  "capstone>=5.0.0,<6.0.0",
  "yara-python>=4.3.0,<5.0.0",
  "scipy>=1.10.0,<2.0.0",
  "networkx>=3.0,<4.0",
  "jinja2>=3.1.0,<4.0.0",
]

[project.scripts]
caspoon = "caspoon.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["caspoon*"]
exclude = ["caspoon.tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=caspoon",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "golden: marks tests as golden/regression tests",
    "requires_r2: marks tests that require radare2",
    "requires_checksec: marks tests that require checksec tool",
    "requires_strings: marks tests that require strings tool",
]

[tool.coverage.run]
source = ["caspoon"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/main.py",
    "*/gui/*",
]

[tool.coverage.report]
omit = [
    "*/gui/*",
    "*/tests/*",
    "*/main.py",
    "*/__main__.py",
]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']
include = '\\.pyi?$'
extend-exclude = '''
/(
  # directories
  \\.eggs
  | \\.git
  | \\.pytest_cache
  | \\.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py310"

# Exclude directories
exclude = [
    ".git",
    ".pytest_cache",
    "__pycache__",
    "build",
    "dist",
    ".venv",
]

[tool.ruff.lint]
# Enable select rule sets
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]

# Ignore specific rules
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex (can enable later)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**/*.py" = ["F401", "F811", "F841"]  # Allow test fixtures and unused variables

[tool.ruff.lint.isort]
known-first-party = ["caspoon"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Enable gradually
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_optional = true

# Module-specific overrides
[[tool.mypy.overrides]]
module = [
    "r2pipe.*",
    "elftools.*",
    "PySide6.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
