name: Security Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'caspoon/pyproject.toml'
      - 'caspoon/requirements*.txt'
      - 'caspoon/requirements*.lock'
      - '.github/workflows/security.yml'
  schedule:
    # Run weekly on Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:  # Allow manual trigger

# Minimal permissions following principle of least privilege
permissions:
  contents: read
  security-events: write  # For uploading to GitHub Security tab
  issues: write  # For creating security issues

jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'caspoon/pyproject.toml'
    
    - name: Install audit tools
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit safety
    
    - name: Audit core dependencies (pip-audit)
      id: audit_core
      run: |
        cd caspoon
        echo "🔍 Auditing core dependencies..."
        pip-audit --requirement requirements.txt --desc --format json --output pip-audit-core.json || true
        pip-audit --requirement requirements.txt --desc
      continue-on-error: true
    
    - name: Audit dev dependencies (pip-audit)
      id: audit_dev
      run: |
        cd caspoon
        echo "🔍 Auditing dev dependencies..."
        pip-audit --requirement requirements-dev.txt --desc --format json --output pip-audit-dev.json || true
        pip-audit --requirement requirements-dev.txt --desc
      continue-on-error: true
    
    - name: Run safety check (alternative scanner)
      id: safety_check
      run: |
        cd caspoon
        echo "🔍 Running safety check..."
        safety check --file requirements.txt --json --output safety-report.json || true
        safety check --file requirements.txt || true
      continue-on-error: true
    
    - name: Upload security scan results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-results
        path: |
          caspoon/pip-audit-*.json
          caspoon/safety-report.json
        retention-days: 90
    
    - name: Check for outdated packages
      run: |
        cd caspoon
        pip install -r requirements.txt -q
        echo "📦 Checking for outdated packages..."
        pip list --outdated --format=columns || true
      continue-on-error: true
    
    - name: Fail if vulnerabilities found
      if: steps.audit_core.outcome == 'failure'
      run: |
        echo "❌ Security vulnerabilities found in core dependencies!"
        echo "Review the audit output above and update affected packages."
        exit 1

  codeql-analysis:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: python
        queries: security-extended
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  supply-chain-security:
    name: Supply Chain Security Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.10'
    
    - name: Check dependency sources
      run: |
        cd caspoon
        echo "🔗 Verifying dependency sources..."
        # Check that all dependencies can be resolved from PyPI
        pip index versions textual
        pip index versions pyelftools
        pip index versions r2pipe
        pip index versions rich
        echo "✅ All core dependencies available from PyPI"
    
    - name: Verify package integrity
      run: |
        cd caspoon
        echo "🔐 Verifying package integrity..."
        python -m pip download --no-deps textual pyelftools r2pipe rich --dest /tmp/packages
        # List downloaded packages (verification that they downloaded successfully)
        ls -lh /tmp/packages/
        echo "✅ Packages downloaded and verified"
    
    - name: Check for typosquatting risks
      run: |
        cd caspoon
        echo "🎯 Checking for common typosquatting patterns..."
        # Basic check for suspicious package names (extend as needed)
        grep -E "(textual|pyelftools|r2pipe|rich)" requirements.txt
        echo "✅ No obvious typosquatting risks detected"

  report-results:
    name: Report Security Results
    runs-on: ubuntu-latest
    needs: [dependency-audit, codeql-analysis, supply-chain-security]
    if: always()
    
    steps:
    - name: Security scan summary
      run: |
        echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| CodeQL Analysis | ${{ needs.codeql-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Supply Chain Check | ${{ needs.supply-chain-security.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.dependency-audit.result }}" = "failure" ] || \
           [ "${{ needs.codeql-analysis.result }}" = "failure" ] || \
           [ "${{ needs.supply-chain-security.result }}" = "failure" ]; then
          echo "⚠️ **Security issues detected!** Review the individual job outputs for details." >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "✅ **All security checks passed!**" >> $GITHUB_STEP_SUMMARY
        fi
