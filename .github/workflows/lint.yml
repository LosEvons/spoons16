name: Code Quality

on:
  push:
    branches: [ main, develop, copilot/** ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    
    # Grant minimal required permissions (principle of least privilege)
    permissions:
      contents: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
        cache-dependency-path: 'caspoon/pyproject.toml'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        cd caspoon
        pip install -e ".[dev]"
    
    - name: Check if linting tools are available
      id: check_tools
      run: |
        cd caspoon
        # Check if ruff is available
        if pip show ruff >/dev/null 2>&1; then
          echo "ruff_available=true" >> $GITHUB_OUTPUT
        else
          echo "ruff_available=false" >> $GITHUB_OUTPUT
          echo "⚠️  ruff is not installed - will be added in subtask 5"
        fi
        # Check if black is available
        if pip show black >/dev/null 2>&1; then
          echo "black_available=true" >> $GITHUB_OUTPUT
        else
          echo "black_available=false" >> $GITHUB_OUTPUT
          echo "⚠️  black is not installed - will be added in subtask 5"
        fi
        # Check if mypy is available
        if pip show mypy >/dev/null 2>&1; then
          echo "mypy_available=true" >> $GITHUB_OUTPUT
        else
          echo "mypy_available=false" >> $GITHUB_OUTPUT
          echo "⚠️  mypy is not installed - will be added in subtask 5"
        fi
    
    - name: Run ruff
      if: steps.check_tools.outputs.ruff_available == 'true'
      run: |
        cd caspoon
        ruff check caspoon/ --output-format=github
      continue-on-error: true  # Don't fail CI on linting errors initially
    
    - name: Run black
      if: steps.check_tools.outputs.black_available == 'true'
      run: |
        cd caspoon
        black --check caspoon/ tests/
      continue-on-error: true  # Don't fail CI on formatting issues initially
    
    - name: Run mypy
      if: steps.check_tools.outputs.mypy_available == 'true'
      run: |
        cd caspoon
        mypy caspoon/ --ignore-missing-imports
      continue-on-error: true  # Don't fail CI on type errors initially
    
    - name: Linting tools not yet installed
      if: steps.check_tools.outputs.ruff_available == 'false' || steps.check_tools.outputs.black_available == 'false' || steps.check_tools.outputs.mypy_available == 'false'
      run: |
        echo "ℹ️  Some linting tools are not yet installed."
        echo "ℹ️  They will be added in subtask 5 (Code Quality Tools)."
        echo "ℹ️  This workflow is prepared and ready for when they are added."
        echo "✅  Lint workflow check passed (tools pending installation)"
