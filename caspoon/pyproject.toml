[project]
name = "caspoon"
version = "0.1.0"
description = "Caspoon Reverse Engineering Toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  { name = "LosEvons" }
]

dependencies = [
  "textual>=0.40.0,<1.0.0",     # TUI framework
  "pyelftools>=0.29,<1.0",       # ELF file parsing
  "r2pipe>=1.7.0,<2.0.0",        # radare2 interface
  "rich>=13.0.0,<15.0.0",        # Text rendering
]

[project.optional-dependencies]
# Windows PE file support
windows = [
  "pefile>=2023.2.7,<2024.0.0",
]

# Pattern detection features
patterns = [
  "capstone>=5.0.0,<6.0.0",
  "yara-python>=4.3.0,<5.0.0",
]

# Advanced analysis
advanced = [
  "scipy>=1.10.0,<2.0.0",
]

# Graph generation and visualization
graphs = [
  "networkx>=3.0,<4.0",
]

# Report generation
reports = [
  "jinja2>=3.1.0,<4.0.0",
]

# Development tools
dev = [
  # Testing
  "pytest>=7.0.0,<9.0.0",
  "pytest-cov>=4.0.0,<5.0.0",
  "pytest-asyncio>=0.21.0,<2.0.0",
  "pytest-mock>=3.10.0,<4.0.0",
  "pytest-xdist>=3.0.0,<4.0.0",
  "pytest-timeout>=2.1.0,<3.0.0",
  
  # Code quality
  "black>=23.0.0,<25.0.0",
  "mypy>=1.0.0,<2.0.0",
  "ruff>=0.1.0,<1.0.0",
]

# All optional features
all = [
  "pefile>=2023.2.7,<2024.0.0",
  "capstone>=5.0.0,<6.0.0",
  "yara-python>=4.3.0,<5.0.0",
  "scipy>=1.10.0,<2.0.0",
  "networkx>=3.0,<4.0",
  "jinja2>=3.1.0,<4.0.0",
]

[project.scripts]
caspoon = "caspoon.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=caspoon",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "golden: marks tests as golden/regression tests",
    "requires_r2: marks tests that require radare2",
    "requires_checksec: marks tests that require checksec tool",
    "requires_strings: marks tests that require strings tool",
]

[tool.coverage.run]
source = ["caspoon"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/main.py",
    "*/ui/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
