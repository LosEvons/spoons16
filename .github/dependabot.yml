version: 2
updates:
  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
  
  # Python dependencies in caspoon/
  - package-ecosystem: "pip"
    directory: "/caspoon"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
      include: "scope"
    
    # Limit open PRs to avoid spam
    open-pull-requests-limit: 5
    
    # Group updates intelligently
    groups:
      # Testing dependencies together
      testing-dependencies:
        patterns:
          - "pytest*"
        update-types:
          - "minor"
          - "patch"
      
      # Code quality tools together
      linting-dependencies:
        patterns:
          - "black"
          - "ruff"
          - "mypy"
        update-types:
          - "minor"
          - "patch"
      
      # Optional features together (patch only)
      optional-dependencies:
        patterns:
          - "pefile"
          - "capstone"
          - "yara-python"
          - "scipy"
          - "networkx"
          - "jinja2"
        update-types:
          - "patch"
    
    # Ignore major version updates (review manually)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
