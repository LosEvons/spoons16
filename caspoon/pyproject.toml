[project]
name = "caspoon"
version = "0.1.0"
description = "Caspoon Reverse Engineering Toolkit"
authors = [
  { name = "LosEvons" }
]
requires-python = ">=3.10"

dependencies = [
  "textual",
  "pyelftools",
  "r2pipe",
  "rich"
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0.0,<8.0.0",
  "pytest-cov>=4.0.0,<8.0.0",
  "pytest-asyncio>=0.21.0,<1.0.0",
  "pytest-mock>=3.10.0,<4.0.0",
  "pytest-xdist>=3.0.0,<4.0.0",
  "pytest-timeout>=2.1.0,<3.0.0",
]

[project.scripts]
caspoon = "caspoon.main:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=caspoon",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "golden: marks tests as golden/regression tests",
    "requires_r2: marks tests that require radare2",
    "requires_checksec: marks tests that require checksec tool",
    "requires_strings: marks tests that require strings tool",
]

[tool.coverage.run]
source = ["caspoon"]
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/main.py",
    "*/ui/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
precision = 2
